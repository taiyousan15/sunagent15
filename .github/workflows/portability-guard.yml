name: Portability Guard

# Detect hardcoded user-specific absolute paths that would break the project
# for other users (different OS / username / install location).
#
# Background: 2026-04-17/18 Opus×Codex Pro 5-round audit found 12 such paths
# (Critical 4, High 8) including debate/write_*.py and xtaiou scripts that
# referenced /Users/matsumototoshihiko or $HOME/Desktop/開発2026.
# This workflow prevents regression.
#
# Reference: debate-audit/PORTABILITY_ABSOLUTE_PATH_AUDIT.md

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  detect-hardcoded-paths:
    name: Detect hardcoded user-specific absolute paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        # Ubuntu runners do not include ripgrep by default. Without this step,
        # the `rg` invocation below fails with "command not found", and because
        # bash treats failed commands inside `if` as condition=false, the guard
        # silently falls through to the success branch — masking real violations.
        # (Pre-existing infra bug uncovered while shipping Phase 1A on 2026-04-28.)
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          rg --version | head -1

      - name: Run portability guard (rg detection)
        # Detect user-specific patterns that break portability:
        # - Hardcoded username (matsumototoshihiko)
        # - Personal project directories ($HOME/Desktop/開発2026/...)
        # - Hooks/scripts that hardcode path.join(HOME, 'Desktop') as the
        #   multi-project search root (PR β regression guard, 2026-04-27).
        # - $HOME/(Desktop|taisun_agent), ${HOME}/(Desktop|taisun_agent),
        #   /Users/<name>/(Desktop|taisun_agent), ~/taisun_agent
        #   (Phase 1A regex hardening, 2026-04-28).
        # The canonical helper at .claude/hooks/lib/project-dir-resolver.js
        # accepts CLAUDE_PROJECTS_DIR override; new hooks must use it.
        #
        # Excluded paths (audit history / logs / backups, no runtime impact):
        # - docs/research-knowledge-scaling/, debate-v*/, debate-priority1/,
        #   debate-audit/, debate/, ログ/, *.log, *.bak*
        # - .claude/hooks/lib/project-dir-resolver.js (canonical resolver
        #   defines the legacy fallback)
        # - docs/reviews/** (sanitized historical review docs may quote the
        #   literal pattern as evidence)
        #
        # Diagnostic strategy: capture rg exit code + stderr separately so a
        # silent regex compile failure cannot be masked by `if ... ; else` logic.
        run: |
          echo "rg version: $(rg --version | head -1)"
          echo "pwd: $(pwd)"
          echo "ls top:"; ls -la | head -20
          echo ""
          # Smoke test: each regex branch independently to isolate which one
          # matches and which doesn't. If any non-empty branch silently gives
          # zero matches when local does, that branch is the culprit.
          echo "=== smoke per-branch ==="
          for pat in 'matsumototoshihiko' '~/taisun_agent' '[$]HOME/(Desktop|taisun_agent)' '[$][{]HOME[}]/(Desktop|taisun_agent)' '/Users/[^/[:space:]]+/(Desktop|taisun_agent)'; do
            count=$(rg -l --hidden \
                       --glob '!.git/**' \
                       --glob '!node_modules/**' \
                       --glob '!.github/workflows/portability-guard.yml' \
                       "$pat" 2>/dev/null | wc -l | tr -d ' ')
            echo "  pattern='$pat' matched_files=$count"
          done
          echo "=== smoke end ==="
          echo ""
          set +e
          rg_output=$(rg -l \
                       --glob '!docs/research-knowledge-scaling/**' \
                       --glob '!debate-v*/**' \
                       --glob '!debate-priority1/**' \
                       --glob '!debate-audit/**' \
                       --glob '!debate/**' \
                       --glob '!ログ/**' \
                       --glob '!*.log' \
                       --glob '!*.bak*' \
                       --glob '!.git/**' \
                       --glob '!node_modules/**' \
                       --glob '!.github/workflows/portability-guard.yml' \
                       --glob '!.claude/temp-context/**' \
                       --glob '!.claude/hooks/lib/project-dir-resolver.js' \
                       --glob '!docs/reviews/**' \
                       --hidden \
                       'matsumototoshihiko|/Desktop/開発2026|path\.join\([^)]*HOME[^)]*Desktop|~/taisun_agent|[$]HOME/(Desktop|taisun_agent)|[$][{]HOME[}]/(Desktop|taisun_agent)|/Users/[^/[:space:]]+/(Desktop|taisun_agent)' 2>&1)
          rg_exit=$?
          set -e
          echo "rg exit code: $rg_exit"
          echo "rg output:"
          echo "$rg_output"
          echo "---"

          # rg exit codes: 0=matches found, 1=no matches, 2=error
          if [ "$rg_exit" -eq 2 ]; then
            echo "::error::ripgrep failed with error (exit 2). See output above."
            exit 1
          fi
          if [ "$rg_exit" -eq 0 ] && [ -n "$rg_output" ]; then
            echo ""
            echo "::error::Hardcoded user-specific absolute paths detected (see file list above)"
            echo ""
            echo "Why this matters:"
            echo "  /Users/<your-username>/ and \$HOME/Desktop/<personal-folder>/"
            echo "  break the project for other users (different username/OS/install path)."
            echo ""
            echo "How to fix:"
            echo "  - Shell scripts:"
            echo "      PROJECT_DIR=\"\${YOUR_ENV_VAR:-\$(cd \"\$(dirname \"\$0\")/..\" && pwd)}\""
            echo "  - Node.js / JS:"
            echo "      const PROJECT_ROOT = path.resolve(__dirname, '../..');"
            echo "  - JSON examples / docs:"
            echo "      Use placeholders like <YOUR_PROJECT_PATH> or <YOUR_PROJECT_ID>"
            echo ""
            echo "Reference: debate-audit/PORTABILITY_ABSOLUTE_PATH_AUDIT.md"
            exit 1
          fi

          echo "✓ No hardcoded user-specific absolute paths detected"
