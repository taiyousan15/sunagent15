name: Portability Guard

# Detect hardcoded user-specific absolute paths that would break the project
# for other users (different OS / username / install location).
#
# Background: 2026-04-17/18 Opus×Codex Pro 5-round audit found 12 such paths
# (Critical 4, High 8). The Phase 1A regex hardening (2026-04-28) added
# patterns for ~/taisun_agent, $HOME/(Desktop|taisun_agent), etc.
#
# Why git grep (instead of ripgrep):
#   ripgrep 14.1.0 on Ubuntu CI showed inconsistent recursive-walk behavior
#   that masked real violations even when explicit-path searches worked.
#   git grep is built into git (no install step), tracks the repo's actual
#   tracked-files set, has identical behavior across platforms, and avoids
#   the dependency-on-runner-image issue entirely.
#
# Reference: debate-audit/PORTABILITY_ABSOLUTE_PATH_AUDIT.md

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  detect-hardcoded-paths:
    name: Detect hardcoded user-specific absolute paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run portability guard (git grep detection)
        # Detect user-specific patterns that break portability:
        # - Hardcoded username (matsumototoshihiko)
        # - Personal project directories ($HOME/Desktop/開発2026/...)
        # - Hooks/scripts that hardcode path.join(HOME, 'Desktop')
        # - $HOME/(Desktop|taisun_agent), ${HOME}/(Desktop|taisun_agent),
        #   /Users/<name>/(Desktop|taisun_agent), ~/taisun_agent
        # The canonical helper at .claude/hooks/lib/project-dir-resolver.js
        # accepts CLAUDE_PROJECTS_DIR override; new hooks must use it.
        #
        # Excluded paths via :(exclude) pathspec magic:
        # - audit history (debate-*, debate/, debate-audit/, debate-priority1/, debate-v*/)
        # - session logs (ログ/, *.log)
        # - backups (*.bak*)
        # - this workflow file (it documents patterns intentionally)
        # - canonical resolver (defines legacy fallback intentionally)
        # - sanitized historical review docs (docs/reviews/**)
        # - research-knowledge-scaling records
        run: |
          set +e
          matches=$(git grep -lE \
            'matsumototoshihiko|/Desktop/開発2026|path\.join\([^)]*HOME[^)]*Desktop|~/taisun_agent|[$]HOME/(Desktop|taisun_agent)|[$][{]HOME[}]/(Desktop|taisun_agent)|/Users/[^/[:space:]]+/(Desktop|taisun_agent)' \
            -- \
            ':(exclude)docs/research-knowledge-scaling/**' \
            ':(exclude)debate-v*/**' \
            ':(exclude)debate-priority1/**' \
            ':(exclude)debate-audit/**' \
            ':(exclude)debate/**' \
            ':(exclude)ログ/**' \
            ':(exclude)*.log' \
            ':(exclude)*.bak*' \
            ':(exclude).github/workflows/portability-guard.yml' \
            ':(exclude).claude/temp-context/**' \
            ':(exclude).claude/hooks/lib/project-dir-resolver.js' \
            ':(exclude)docs/reviews/**' \
            2>&1)
          rc=$?
          set -e

          # git grep exit codes: 0 = matches found, 1 = no matches, 2+ = error
          if [ "$rc" -ge 2 ]; then
            echo "::error::git grep failed (exit $rc):"
            echo "$matches"
            exit 1
          fi

          if [ "$rc" -eq 0 ] && [ -n "$matches" ]; then
            echo "Files with hardcoded user-specific absolute paths:"
            echo "$matches"
            echo ""
            echo "::error::Hardcoded user-specific absolute paths detected (see file list above)"
            echo ""
            echo "Why this matters:"
            echo "  /Users/<your-username>/ and \$HOME/Desktop/<personal-folder>/"
            echo "  break the project for other users (different username/OS/install path)."
            echo ""
            echo "How to fix:"
            echo "  - Shell scripts:"
            echo "      PROJECT_DIR=\"\${YOUR_ENV_VAR:-\$(cd \"\$(dirname \"\$0\")/..\" && pwd)}\""
            echo "  - Node.js / JS:"
            echo "      const PROJECT_ROOT = path.resolve(__dirname, '../..');"
            echo "  - JSON examples / docs:"
            echo "      Use placeholders like <YOUR_PROJECT_PATH> or <YOUR_PROJECT_ID>"
            echo ""
            echo "Reference: debate-audit/PORTABILITY_ABSOLUTE_PATH_AUDIT.md"
            exit 1
          fi

          echo "✓ No hardcoded user-specific absolute paths detected"
