name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required for SARIF upload to GitHub Security
permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '20.x'
  COVERAGE_THRESHOLD: 80

jobs:
  # ============================================
  # Detect Changed Paths
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'jest.config.*'
            docs:
              - 'docs/**'
              - '*.md'
              - '.claude/**'

  # ============================================
  # Lint & Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for hidden/bidi Unicode
        run: npm run check:unicode

      - name: Check UTF-8 encoding
        run: npm run quality:encoding -- --all

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --ci --runInBand --forceExit
        timeout-minutes: 10

      - name: Run hook tests
        run: npx jest --testMatch='**/.claude/hooks/__tests__/**/*.test.js' --ci --forceExit
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        if: needs.changes.outputs.code == 'true'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Skip coverage check (docs-only)
        if: needs.changes.outputs.code != 'true'
        run: echo "Skipping coverage threshold check for docs-only changes"

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Build Check
  # ============================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # ============================================
  # Windows Script Validation
  # Syntax-checks PowerShell installers and regression-guards against known
  # portability bugs. Does not run the actual installer (needs TAISUN ecosystem).
  # ============================================
  windows-scripts:
    name: Windows Script Validation
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Syntax check PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/install.ps1',
            'scripts/setup-project.ps1',
            'scripts/quick-install.ps1'
          )
          $failed = $false
          foreach ($s in $scripts) {
            if (-not (Test-Path $s)) { continue }
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $s), [ref]$tokens, [ref]$errors
            )
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL: $s"
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "OK: $s"
            }
          }
          if ($failed) { exit 1 }

      - name: Regression guard — setup-project.ps1 reads agent-source
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'scripts/setup-project.ps1'
          if ($content -notmatch '\.claude\\agent-source') {
            Write-Error "setup-project.ps1 must reference .claude\agent-source (was .claude\agents, see P0 fix)"
            exit 1
          }
          Write-Host "OK: setup-project.ps1 references .claude\agent-source"

      - name: Regression guard — install.ps1 uses SkillProfile with Profile alias
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'scripts/install.ps1'
          if ($content -notmatch '\[Alias\("Profile"\)\]') {
            Write-Error "install.ps1 must keep -Profile as Alias for backward compatibility"
            exit 1
          }
          if ($content -notmatch '\$SkillProfile') {
            Write-Error "install.ps1 must use `$SkillProfile (not `$Profile, which is an automatic variable)"
            exit 1
          }
          Write-Host "OK: install.ps1 uses \$SkillProfile with [Alias(\"Profile\")]"

  # ============================================
  # Quality Gate Summary
  # ============================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, windows-scripts]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check (incl. UTF-8) | ${{ needs.lint.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Pass' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Scripts | ${{ needs.windows-scripts.result == 'success' && '✅ Pass' || needs.windows-scripts.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.windows-scripts.result }}" != "success" && "${{ needs.windows-scripts.result }}" != "skipped" ]]; then
            echo ""
            echo "::error::Quality gate failed. Please fix the issues above."
            exit 1
          fi

          echo ""
          echo "✅ All quality gates passed!"
