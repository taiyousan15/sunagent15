# TAISUN Agent log rotation config (Linux)
# Install: sudo cp scripts/taisun-logrotate.conf /etc/logrotate.d/taisun-agent
# Targets: .claude/hooks/data/ JSONL/JSON log files

# NOTE: /path/to/sunagent15 を実際のパスに置換してください
# 例: sed -i "s|/path/to/sunagent15|$HOME/sunagent15|g" /etc/logrotate.d/taisun-agent
/path/to/sunagent15/.claude/hooks/data/*.jsonl
/path/to/sunagent15/.claude/hooks/data/*.json
/path/to/sunagent15/.claude/hooks/data/*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
    maxsize 10M
}
