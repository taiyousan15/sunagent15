# TAISUN Agent log rotation config (macOS)
# Install: sudo cp scripts/taisun-newsyslog.conf /etc/newsyslog.d/taisun-agent.conf
# Format: logfilename [owner:group] mode count size(KB) when flags

/path/to/sunagent15/.claude/hooks/data/compact-metrics.jsonl    644  4  10240  *  J
/path/to/sunagent15/.claude/hooks/data/agent-guard-detail.json  644  4  10240  *  J
/path/to/sunagent15/.claude/hooks/data/cost-tracking.jsonl      644  4  10240  *  J
/path/to/sunagent15/.claude/hooks/data/cost-alert.log           644  4  10240  *  J
